name: Release

# Runs after a merge to main. main is only ever advanced by promoting dev (already
# fully validated by ci.yml/codeql.yml), so this workflow does not re-run the test
# suite — it just decides whether this push shipped a new version, and if so tags,
# builds, and publishes it. No CHANGELOG bump means no new version, so it's a no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Tag & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from CHANGELOG.md
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "Could not find a '## X.Y.Z' heading at the top of CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check_tag
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          awk '/^## /{if (seen) exit; seen=1; next} seen' CHANGELOG.md > /tmp/release-notes.md

      # Zig cross-compiles every release target from this one runner, so there is
      # no macOS job here. Pinned + checksummed to match ci.yml.
      - name: Install Zig
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz"
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -C /usr/local -xf /tmp/zig.tar.xz
          echo "/usr/local/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      # Asset names must stay in the `bedd-<os>-<arch>` shape install.sh builds
      # its download URL from — see install.sh's OS/ARCH normalisation.
      # Linux targets are musl so the binary is static and runs anywhere.
      - name: Build release binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local zig_target="$1" asset="$2"
            echo "building $asset ($zig_target)"
            rm -rf "out/$zig_target"
            zig build -Doptimize=ReleaseFast -Dcpu=baseline \
              -Dtarget="$zig_target" -p "out/$zig_target"
            install -m 755 "out/$zig_target/bin/bedd" "dist/$asset"
          }
          build x86_64-linux-musl   bedd-linux-x86_64
          build aarch64-linux-musl  bedd-linux-aarch64
          build x86_64-macos        bedd-darwin-x86_64
          build aarch64-macos       bedd-darwin-aarch64

          cd dist && sha256sum bedd-* > SHA256SUMS && cat SHA256SUMS

      # The native binary is the only one this runner can execute; the others are
      # checked for the architecture they claim, which is what a bad -Dtarget
      # would get wrong.
      - name: Verify binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ./dist/bedd-linux-x86_64 version

          # `file` words Mach-O differently on Linux and macOS ("... 64-bit arm64
          # executable" vs "... 64-bit executable arm64"), so match the format and
          # the architecture separately rather than one fixed phrase.
          check() {
            local path="$1" format="$2" arch="$3" out
            out="$(file -b "$path")"
            case "$out" in
              *"$format"*) ;;
              *) echo "$path: expected $format, got: $out" >&2; exit 1 ;;
            esac
            case "$out" in
              *"$arch"*) ;;
              *) echo "$path: expected $arch, got: $out" >&2; exit 1 ;;
            esac
            echo "$path: $out"
          }
          check dist/bedd-linux-x86_64    ELF     x86-64
          check dist/bedd-linux-aarch64   ELF     aarch64
          check dist/bedd-darwin-x86_64   Mach-O  x86_64
          check dist/bedd-darwin-aarch64  Mach-O  arm64

      - name: Log in to GHCR
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/team-deepiri/bedd:${{ steps.version.outputs.version }}
            ghcr.io/team-deepiri/bedd:latest

      # Pushed only after the image is built and published, so a failed build
      # doesn't leave a dangling tag with no corresponding image — a rerun after
      # a build failure still sees exists=false and retries the whole job.
      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            dist/bedd-linux-x86_64
            dist/bedd-linux-aarch64
            dist/bedd-darwin-x86_64
            dist/bedd-darwin-aarch64
            dist/SHA256SUMS
